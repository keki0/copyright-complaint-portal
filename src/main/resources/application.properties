spring.application.name=copyright-complaint-portal

server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/copyright_portal}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

management.endpoints.web.exposure.include=health,info

# File upload configuration
# The application itself rejects files over 5 MB with a friendly message;
# the container limits are slightly higher so that check can run.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Local document storage
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# ---------------------------------------------------------------
# Security
# ---------------------------------------------------------------
# Session cookie hardening and idle timeout
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Initial accounts created on first start-up (see DataInitializer).
# The defaults are for local development only - override them with
# environment variables in Jenkins / Docker / Ansible.
app.security.admin.name=${APP_ADMIN_NAME:Portal Administrator}
app.security.admin.email=${APP_ADMIN_EMAIL:admin@copyrightportal.com}
app.security.admin.password=${APP_ADMIN_PASSWORD:Admin@12345}

app.security.reviewer.name=${APP_REVIEWER_NAME:Portal Reviewer}
app.security.reviewer.email=${APP_REVIEWER_EMAIL:reviewer@copyrightportal.com}
app.security.reviewer.password=${APP_REVIEWER_PASSWORD:Reviewer@12345}
