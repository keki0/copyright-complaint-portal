<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reviewer Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/">
            Copyright Complaint Portal
        </a>

        <span class="navbar-text text-white">
            Reviewer Dashboard
        </span>

    </div>

</nav>


<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2>
                Reviewer Dashboard
            </h2>

            <p class="text-muted mb-0">
                Review and process submitted copyright complaints.
            </p>

        </div>

        <span class="badge bg-warning text-dark fs-6">

            Pending:
            <span th:text="${#lists.size(complaints)}">
            </span>

        </span>

    </div>


    <div th:if="${#lists.isEmpty(complaints)}"
         class="alert alert-success">

        No complaints are currently pending review.

    </div>


    <div th:unless="${#lists.isEmpty(complaints)}"
         class="card shadow-sm">

        <div class="table-responsive">

            <table class="table table-hover mb-0">

                <thead class="table-dark">

                <tr>

                    <th>Complaint ID</th>

                    <th>Work</th>

                    <th>Type</th>

                    <th>Submitted</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody>

                <tr th:each="complaint : ${complaints}">

                    <td>

                        <strong
                            th:text="${complaint.complaintNumber}">
                        </strong>

                    </td>

                    <td
                        th:text="${complaint.workTitle}">
                    </td>

                    <td
                        th:text="${complaint.copyrightType}">
                    </td>

                    <td
                        th:text="${#temporals.format(
                            complaint.submittedAt,
                            'dd MMM yyyy HH:mm'
                        )}">
                    </td>

                    <td>

                        <span class="badge bg-warning text-dark"
                              th:text="${complaint.status}">
                        </span>

                    </td>

                    <td>

                        <a
                            th:href="@{/reviewer/complaint/{id}
                                (id=${complaint.id})}"
                            class="btn btn-primary btn-sm">

                            Review

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
