<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reviewer Dashboard')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
            <h2>Reviewer Dashboard</h2>
            <p class="text-muted mb-0">Review and process submitted copyright complaints.</p>
        </div>
        <span class="badge bg-warning text-dark fs-6" id="pending-count">
            Pending:
            <span th:text="${pendingCount}">0</span>
        </span>
    </div>

    <div th:replace="~{fragments/layout :: alerts}"></div>

    <!-- Status counters -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3" th:each="entry : ${counts}">
            <div class="stat-card">
                <div class="stat-value" th:text="${entry.value}">0</div>
                <div th:text="${#strings.replace(entry.key.name(), '_', ' ')}">STATUS</div>
            </div>
        </div>
    </div>

    <!-- Filters and search -->
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">

        <ul class="nav nav-pills flex-wrap">
            <li class="nav-item" th:each="f : ${filters}">
                <a class="nav-link py-1 px-3"
                   th:classappend="${f == activeFilter} ? 'active' : ''"
                   th:href="@{/reviewer/dashboard(filter=${f}, q=${query})}"
                   th:text="${f == 'MINE' ? 'ASSIGNED TO ME' : #strings.replace(f, '_', ' ')}">FILTER</a>
            </li>
        </ul>

        <form th:action="@{/reviewer/dashboard}" method="get" class="d-flex gap-2" id="search-form">
            <input type="hidden" name="filter" th:value="${activeFilter}">
            <input type="search" name="q" class="form-control form-control-sm" th:value="${query}"
                   placeholder="ID, title or email">
            <button type="submit" class="btn btn-sm btn-dark">Search</button>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(complaints)}" class="alert alert-success" id="no-results">
        No complaints match this view.
    </div>

    <div th:unless="${#lists.isEmpty(complaints)}" class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle" id="complaints-table">
                <thead class="table-dark">
                <tr>
                    <th>Complaint ID</th>
                    <th>Work</th>
                    <th>Type</th>
                    <th>Complainant</th>
                    <th>Submitted</th>
                    <th>Status</th>
                    <th>Assigned To</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="complaint : ${complaints}">
                    <td><strong th:text="${complaint.complaintNumber}"></strong></td>
                    <td th:text="${complaint.workTitle}"></td>
                    <td th:text="${complaint.copyrightType}"></td>
                    <td class="small" th:text="${complaint.complainant.email}"></td>
                    <td th:text="${#temporals.format(complaint.submittedAt, 'dd MMM yyyy HH:mm')}"></td>
                    <td><span th:replace="~{fragments/layout :: statusBadge(${complaint.status})}"></span></td>
                    <td class="small">
                        <span th:if="${complaint.assignedReviewer != null}"
                              th:text="${complaint.isAssignedTo(currentUser) ? 'You' : complaint.assignedReviewer.name}"></span>
                        <span th:if="${complaint.assignedReviewer == null}" class="text-muted">Unassigned</span>
                    </td>
                    <td>
                        <a th:href="@{/reviewer/complaint/{id}(id=${complaint.id})}"
                           class="btn btn-primary btn-sm review-link"
                           th:text="${complaint.finalized ? 'View' : 'Review'}">Review</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
