<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-body p-4">

                    <h2 class="mb-1">Login</h2>
                    <p class="text-muted mb-4">Sign in to submit, review or track complaints.</p>

                    <div th:if="${param.error}" class="alert alert-danger" id="login-error">
                        Invalid email or password, or the account is disabled.
                    </div>

                    <div th:if="${param.logout}" class="alert alert-info" id="logout-message">
                        You have been logged out.
                    </div>

                    <div th:if="${param.registered}" class="alert alert-success" id="registered-message">
                        Account created. Please log in with your email and password.
                    </div>

                    <form th:action="@{/login}" method="post" id="login-form">

                        <div class="mb-3">
                            <label class="form-label" for="email">Email Address</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   autocomplete="username" required autofocus>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100" id="login-btn">Login</button>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        Don't have an account?
                        <a th:href="@{/register}">Register as a complainant</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
