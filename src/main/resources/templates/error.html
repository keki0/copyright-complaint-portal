<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="display-4 text-secondary mb-3" th:text="${status} ?: 'Error'">Error</div>
                    <h2 th:text="${error} ?: 'Something went wrong'">Something went wrong</h2>
                    <p class="text-muted mt-3" th:if="${message != null and !#strings.isEmpty(message)}"
                       th:text="${message}"></p>
                    <p class="text-muted mt-3" th:unless="${message != null and !#strings.isEmpty(message)}">
                        The page could not be displayed. Please try again.
                    </p>
                    <a th:href="@{/}" class="btn btn-primary mt-2">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
