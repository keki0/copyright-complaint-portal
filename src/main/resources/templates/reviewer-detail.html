<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Review Complaint</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

</head>


<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="/">

            Copyright Complaint Portal

        </a>

        <a
            href="/reviewer/dashboard"
            class="btn btn-outline-light btn-sm">

            ← Dashboard

        </a>

    </div>

</nav>


<div class="container py-5">

    <div class="row g-4">

        <!-- Complaint Information -->

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h3 class="mb-4">

                        Complaint Review

                    </h3>


                    <div class="row mb-3">

                        <div class="col-md-6">

                            <small class="text-muted">
                                Complaint ID
                            </small>

                            <h5
                                th:text="${complaint.complaintNumber}">
                            </h5>

                        </div>


                        <div class="col-md-6">

                            <small class="text-muted">
                                Current Status
                            </small>

                            <h5>

                                <span
                                    class="badge bg-warning text-dark"
                                    th:text="${complaint.status}">
                                </span>

                            </h5>

                        </div>

                    </div>


                    <hr>


                    <h5>Complainant</h5>

                    <p>

                        <strong>Name:</strong>

                        <span
                            th:text="${complaint.complainant.name}">
                        </span>

                        <br>

                        <strong>Email:</strong>

                        <span
                            th:text="${complaint.complainant.email}">
                        </span>

                    </p>


                    <h5 class="mt-4">
                        Copyright Work
                    </h5>

                    <p>

                        <strong>Title:</strong>

                        <span
                            th:text="${complaint.workTitle}">
                        </span>

                        <br>

                        <strong>Type:</strong>

                        <span
                            th:text="${complaint.copyrightType}">
                        </span>

                    </p>


                    <h5 class="mt-4">
                        Description
                    </h5>

                    <div class="border rounded p-3 bg-light">

                        <span
                            th:text="${complaint.description}">
                        </span>

                    </div>


                    <h5 class="mt-4">
                        Alleged Infringement
                    </h5>

                    <div class="border rounded p-3 bg-light">

                        <span
                            th:text="${complaint.infringementDetails}">
                        </span>

                    </div>

                </div>

            </div>

        </div>


        <!-- Review Panel -->

        <div class="col-lg-4">

            <div class="card shadow-sm">

                <div class="card-body">

                    <h4>
                        Reviewer Action
                    </h4>

                    <p class="text-muted">
                        Record your decision and remarks.
                    </p>


                    <form
                        th:action="@{/reviewer/complaint/{id}/review(
                            id=${complaint.id})}"
                        method="post">


                        <div class="mb-3">

                            <label class="form-label">
                                Decision
                            </label>

                            <select
                                name="decision"
                                class="form-select"
                                required>

                                <option value="">
                                    Select decision
                                </option>

                                <option value="APPROVE">
                                    Approve
                                </option>

                                <option value="REJECT">
                                    Reject
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Review Remarks
                            </label>

                            <textarea
                                name="remarks"
                                class="form-control"
                                rows="6"
                                minlength="10"
                                required
                                placeholder="Enter review remarks...">
                            </textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-success w-100">

                            Submit Decision

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
