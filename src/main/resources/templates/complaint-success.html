<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Complaint Submitted')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow text-center">
                <div class="card-body p-5">

                    <div class="display-4 mb-3">&#10003;</div>

                    <h2 class="text-success">Complaint Submitted Successfully</h2>

                    <p class="text-muted mt-3">Your copyright complaint has been successfully registered.</p>

                    <div class="alert alert-light border mt-4">
                        <p class="mb-1">Your Complaint ID</p>
                        <h2 class="fw-bold" id="complaint-number" th:text="${complaint.complaintNumber}"></h2>
                    </div>

                    <p>
                        Current Status:
                        <strong id="complaint-status" th:text="${complaint.status}"></strong>
                    </p>

                    <div class="d-flex justify-content-center gap-2 mt-3 flex-wrap">
                        <a th:href="@{/complaint/track(id=${complaint.complaintNumber})}"
                           class="btn btn-primary">Track this Complaint</a>
                        <a th:href="@{/complaint/my}" class="btn btn-outline-secondary">My Complaints</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
