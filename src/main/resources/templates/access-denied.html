<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Access Denied')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm text-center">
                <div class="card-body p-5">
                    <div class="display-4 text-danger mb-3">403</div>
                    <h2 id="access-denied-title">Access Denied</h2>
                    <p class="text-muted mt-3">
                        Your account does not have permission to open this page.
                    </p>
                    <p class="small text-muted" th:if="${message}" th:text="${message}"></p>
                    <a th:href="@{/}" class="btn btn-primary mt-2">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
